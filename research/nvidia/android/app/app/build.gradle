// SpeechBench (docs/nvidia-speech.md): runs NVIDIA's NeMo-Speech.cpp (Nemotron ASR +
// Nemotron 3 Diarization) and the current stack's on-device form (whisper.cpp +
// sherpa-onnx) in-process on the same WAV, through research/nvidia/android/native.
// The native libraries are copied into src/main/jniLibs by ../build-app.sh.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.plaudharness.speechbench'
    compileSdk 34

    defaultConfig {
        applicationId "com.plaudharness.speechbench"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }   // extract .so files so their sizes are plain files on the device
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}
