# Full suite on a clean checkout.
#
# What CI has, and what it deliberately lacks (HARNESS_POLICY):
#   * Bumble, the BLE stack under the emulator, at its pin in
#     docs/reference-pins.txt. It is reference material (immutable evidence), so
#     it is fetched into reference/upstream/bumble, never vendored, and installed
#     editable, exactly as in local setup.
#   * The Plaud SDK is proprietary (PROJECT.md section 2) and is NOT fetched, so
#     build/evidence/** (the decompiled SDK) and the .aar are absent. Tests that
#     need them skip, each with its reason; tests that read the committed
#     docs/evidence-digest.json still run. tests/conftest.py prints every skip
#     grouped by reason and, with PLAUD_STRICT_SKIPS=1, fails the run on a skip
#     that no documented gate (ENV_GATES there) explains.
#   * No apt packages: the soundfile wheel bundles libsndfile (with Opus) and the
#     av wheel bundles FFmpeg. meeteval ships only an sdist; the runner's gcc
#     builds it and the pip cache keeps the built wheel.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Three platforms: R-CI-1 (docs/project-state.md) was a result that differed
    # between LAPACK builds, and only a real runner showed it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash  # -eo pipefail
    env:
      # Nothing may write bytecode under reference/** (tests/conftest.py does the
      # same inside pytest; this covers the scripts the job runs outside it).
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/ci.txt
            requirements/all.txt

      - name: Fetch Bumble at its pin
        run: |
          pin=$(awk '$2 == "https://github.com/google/bumble.git" {print $1; exit}' docs/reference-pins.txt)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "no bumble pin in docs/reference-pins.txt" >&2; exit 1
          fi
          dest=reference/upstream/bumble
          mkdir -p "$dest"
          git -C "$dest" init -q
          git -C "$dest" remote add origin https://github.com/google/bumble.git
          git -C "$dest" fetch -q --depth 1 origin "$pin"
          git -C "$dest" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$pin"
          echo "bumble at $pin"

      # The local layout (requirements/all.txt header): a .venv at the repository
      # root. scripts/local-up.sh and scripts/make-synthetic-set.sh run on
      # .venv/bin/python, and tests/test_compose_runtime.py runs local-up.sh.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e reference/upstream/bumble
          .venv/bin/python -m pip install -r requirements/ci.txt
          .venv/bin/python -m pip freeze --exclude-editable

      # Every reference repository's state INCLUDING ignored files, taken after
      # the editable install (which leaves bumble.egg-info/ and bumble/_version.py).
      # bumble's own .gitignore hides __pycache__ from a plain `git status`, so
      # only this before/after comparison would catch bytecode written there.
      - name: Snapshot reference tree
        id: snapshot
        run: |
          for d in reference/*/*/; do
            [ -d "$d/.git" ] || continue
            echo "== $d"
            git -C "$d" status --porcelain --ignored
          done > "$RUNNER_TEMP/reference-before.txt"
          cat "$RUNNER_TEMP/reference-before.txt"

      # One small generated meeting, so the emulator's PLAUD_MEETING_DIR path is
      # exercised (tests/test_compose_runtime.py skips without it). Offline:
      # the model-free formant backend, nothing downloaded.
      - name: Generate a synthetic meeting
        run: N=1 SCENARIO=smoke SEED=1 bash scripts/make-synthetic-set.sh

      # --continue-on-collection-errors: one module that cannot import still
      # fails the job, but no longer hides every other result.
      - name: Tests
        shell: bash -eo pipefail {0}
        env:
          PLAUD_STRICT_SKIPS: "1"
        run: >-
          .venv/bin/python -m pytest tests/
          -rfE -p no:cacheprovider --timeout=120 --durations=15
          --continue-on-collection-errors
          --junitxml="$RUNNER_TEMP/junit.xml"
          2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # Publish the failure reasons as check-run annotations, which the public
      # GitHub API returns without authentication (the raw job log needs a token).
      - name: Annotate failures
        if: ${{ failure() }}
        run: |
          python3 - "$RUNNER_TEMP/junit.xml" "$RUNNER_TEMP/pytest.log" "${{ matrix.os }}" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          junit, log, os_name = sys.argv[1], sys.argv[2], sys.argv[3]
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          n = 0
          try:
              for tc in ET.parse(junit).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      el = tc.find(tag)
                      if el is not None and n < 20:
                          name = f"{tc.get('classname')}::{tc.get('name')}"
                          msg = (el.get("message") or "") + "\n" + (el.text or "")[-1500:]
                          print(f"::error title={tag} ({os_name}): {name}::{esc(msg[:1800])}"); n += 1
          except Exception as exc:
              print(f"::warning::could not read junit xml: {exc}")
          tail = open(log, errors="replace").read().splitlines()[-40:]
          print(f"::error title=pytest tail ({os_name})::" + esc("\n".join(tail)[-3000:]))
          PYEOF

      # reference/** is immutable evidence. Anything that writes into it is a
      # bug in the tooling, so fail loudly rather than let it drift.
      - name: Reference tree is pristine
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        run: |
          status=0
          for d in reference/*/*/; do
            [ -d "$d/.git" ] || continue
            out=$(git -C "$d" status --porcelain)
            if [ -n "$out" ]; then echo "DIRTY: $d"; echo "$out"; status=1; fi
          done
          for d in reference/*/*/; do
            [ -d "$d/.git" ] || continue
            echo "== $d"
            git -C "$d" status --porcelain --ignored
          done > "$RUNNER_TEMP/reference-after.txt"
          if ! diff -u "$RUNNER_TEMP/reference-before.txt" "$RUNNER_TEMP/reference-after.txt"; then
            echo "reference/** gained or lost ignored files during the run (e.g. __pycache__)"
            status=1
          fi
          [ "$status" -eq 0 ] && echo "all reference repositories clean"
          exit "$status"
