# plaud-harness -- V6: `docker compose up -d --wait` brings the whole system live.
#
#   emulator   emulator/serve.py    PlaudPeripheral (portVersion 7) on a Bumble virtual link; every TCP
#                                   client of :9000 gets its own virtual controller on that link, so any
#                                   Bumble central attaches without a radio; JSON health line on :9001
#   mockcloud  python -m mockcloud  local mock of the Plaud partner cloud contract on :8787
#   job        docker/job.sh        one-shot system check (profile "check"): probes both services,
#                                   attaches a central and checks the advertisement, generates a small
#                                   synthetic set, runs the oracle pipeline, scores it against the
#                                   `oracle` gate suite, pushes one device recording through the mock
#                                   cloud (bind, multipart upload, transcription) and scores the result;
#                                   non-zero exit on any failure
#
#   docker compose up -d --wait                       # the system (emulator + mockcloud), healthy
#   docker compose run --rm job                       # the end-to-end check (exit code = verdict)
#   docker compose --profile check up --abort-on-container-exit --exit-code-from job   # same, attached
#   ./scripts/compose-smoke.sh                        # times the bring-up against the 60 s target
#   PLAUD_MEETING_DIR=/app/build/compose/job/meetings/synth-smoke-s0001 docker compose up -d emulator
#                                                     # serve a generated meeting (config changes -> recreated)
#
# HARNESS_POLICY (see docs/compose.md): everything is built locally from python:3.11-slim; the
# network is a private bridge marked internal (no route out, nothing published -- use
# docker/compose.host-ports.yml to publish on 127.0.0.1); build/ artefacts live in the named
# volume harness-build; the network and the volume carry no explicit `name:`, so compose
# prefixes them with the project (`-p` / COMPOSE_PROJECT_NAME isolate two stacks); the job is
# behind a profile so `up --wait` is well defined on every compose version (a one-shot service
# that exits 0 is treated inconsistently by --wait); the mock's multipart ChunkSize is 20000 so
# the job's ~49 KB upload is a genuine multipart one (the documented default is 5 MiB);
# no secrets, no env files, no external network, no image pulls beyond the base image.

name: plaud-harness

services:
  emulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.emulator
    image: plaud-harness/emulator:local
    environment:
      PLAUD_HCI_TRANSPORT: tcp-server:0.0.0.0:9000
      PLAUD_HCI_MODE: bridge
      PLAUD_HEALTH_HOST: 0.0.0.0
      PLAUD_HEALTH_PORT: "9001"
      PLAUD_BUMBLE_LOG: WARNING
      # Served file: empty = unset = the R6-S2 fixture (emulator/serve.py). Compose forwards
      # nothing from the shell by itself; these interpolations are what make
      # `PLAUD_MEETING_DIR=/app/build/... docker compose up -d emulator` take effect.
      PLAUD_MEETING_DIR: ${PLAUD_MEETING_DIR:-}
      PLAUD_FILE: ${PLAUD_FILE:-}
    expose:
      - "9000"
      - "9001"
    volumes:
      - harness-build:/app/build
    networks: [harness]
    healthcheck:
      # emulator/serve.py answers one JSON line per connection on the health port; ready must be true.
      test: ["CMD", "python", "-c", "import json, socket; s = socket.create_connection(('127.0.0.1', 9001), timeout=2); line = s.makefile('rb').readline(); s.close(); assert json.loads(line)['ready'] is True"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 5s
    restart: unless-stopped

  mockcloud:
    build:
      context: .
      dockerfile: docker/Dockerfile.mockcloud
    image: plaud-harness/mockcloud:local
    command: ["python", "-m", "mockcloud", "--host", "0.0.0.0", "--port", "8787", "--local-file-root", "/app/build", "--chunk-size", "20000"]
    expose:
      - "8787"
    volumes:
      - harness-build:/app/build
    networks: [harness]
    healthcheck:
      # mockcloud/routers/mock.py: GET /_mock/health -> 200 {"mock": true, ...}
      test: ["CMD", "python", "-c", "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8787/_mock/health', timeout=2); assert r.status == 200 and json.loads(r.read())['mock'] is True"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 5s
    restart: unless-stopped

  job:
    build:
      context: .
      dockerfile: docker/Dockerfile.job
    image: plaud-harness/job:local
    profiles: [check]
    command: ["bash", "/app/docker/job.sh"]
    environment:
      MOCKCLOUD_URL: http://mockcloud:8787
      EMULATOR_HEALTH: emulator:9001
      EMULATOR_HCI: tcp-client:emulator:9000
      JOB_OUT: /app/build/compose/job
      JOB_MEETINGS: "2"
      JOB_SCENARIO: smoke
      JOB_SEED: "1"
      JOB_SUITE: oracle
      JOB_CLOUD_TIMEOUT: "60"
      PROBE_TIMEOUT: "30"
    depends_on:
      emulator:
        condition: service_healthy
      mockcloud:
        condition: service_healthy
    volumes:
      - harness-build:/app/build
    networks: [harness]
    restart: "no"

volumes:
  harness-build: {}   # resolves to <project>_harness-build (plaud-harness_harness-build by default)

networks:
  harness:            # resolves to <project>_harness (plaud-harness_harness by default)
    driver: bridge
    internal: true
